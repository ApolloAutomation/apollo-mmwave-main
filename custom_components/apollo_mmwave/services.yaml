update_zone:
  name: Update Zone
  description: "Create, update, clear, or delete a zone. Geometry is in millimetres (Y-down). To clear a zone set shape: none (data may be omitted or null); data without a shape is ignored. Set delete: true to remove the zone and its entities. Rotation and tracked entities are device-wide and can be updated without zone_id."
  fields:
    device_id:
      name: Radar Device
      description: The radar these zones belong to. Required unless the deprecated location field is given.
      required: false
      example: 4f8a2b1c9d3e5f70a1b2c3d4e5f60718
      selector:
        device: {}
    location:
      name: Location Name (deprecated)
      description: "Deprecated: use device_id instead. Matches the device's stored display name from before 2.0 and will be removed in a future release. One of device_id or location must be given."
      required: false
      example: Office
      selector:
        text: {}
    zone_id:
      name: Zone ID
      description: The numeric zone identifier (1..N)
      required: false
      example: 1
      selector:
        number:
          min: 1
          max: 32
    shape:
      name: Shape
      description: Shape of the zone (none, rect, ellipse, polygon). Use 'none' to clear.
      required: false
      selector:
        select:
          options:
            - none
            - rect
            - ellipse
            - polygon
    data:
      name: Shape Data
      description: "Shape data object, or null. Only read when shape is also given. For rect: {x_min,x_max,y_min,y_max}. For ellipse: {cx,cy,rx,ry}. For polygon: {points:[{x,y},...]}. To clear a zone use shape: none."
      required: false
      selector:
        object: {}
    name:
      name: Zone Name
      description: Optional friendly name for the zone. When provided, entity friendly names will be updated.
      required: false
      selector:
        text: {}
    delete:
      name: Delete Zone
      description: If true, deletes the zone and removes the associated entities for this zone.
      required: false
      selector:
        boolean: {}
    input_units:
      name: Target Sensor Units
      description: "Unit the radar's X/Y target sensors report in. Zone geometry is always millimetres; presence detection scales readings by this before testing them. Device-wide. Apollo firmware reports millimetres, so leave this unset unless you are on DIY hardware."
      required: false
      selector:
        select:
          options:
            - mm
            - cm
            - m
            - in
            - ft
            - yd
    rotation_deg:
      name: Rotation Angle (deg)
      description: Optional device rotation angle (-180..180). Device-wide; if provided without zone fields, only the angle is updated for the device.
      required: false
      selector:
        number:
          min: -180
          max: 180
          step: 1
    entities:
      name: Tracked Entities
      description: Optional list of x/y entity id pairs to evaluate presence. Device-wide; a non-empty list replaces the stored list. An empty list means no change, so a card that has not finished loading cannot wipe your pairs. Use clear_entities to empty the list. Ignored when clear_entities is true.
      required: false
      selector:
        object: {}
      example: |
        - { x: sensor.device_target_1_x, y: sensor.device_target_1_y }
        - { x: sensor.device_target_2_x, y: sensor.device_target_2_y }
    clear_entities:
      name: Clear Tracked Entities
      description: If true, empties the tracked entity pair list for this device. The device then tracks nothing instead of falling back to its own LD2450 targets. Takes precedence over entities, which is ignored in the same call.
      required: false
      selector:
        boolean: {}

calibrate_gates:
  name: Calibrate gate thresholds (empty room)
  description: "Listens to the radar's per-gate energy while the room is empty, then sets every gate's move and still threshold just above what it heard. The current thresholds are saved first; use restore_gate_thresholds to undo. Radar Engineering Mode is turned on for the listen and back off afterwards if it was off."
  fields:
    device_id:
      name: Radar Device
      description: The MSR-1, MSR-2 or R-PRO-1 to calibrate (one device per call).
      required: true
      selector:
        device:
          filter:
            - integration: esphome
    duration_s:
      name: Listen for (seconds)
      description: How long to sample the empty room. Longer catches slow periodic noise such as HVAC.
      required: false
      default: 60
      selector:
        number:
          min: 15
          max: 600
          unit_of_measurement: s
    settle_s:
      name: Leave-the-room delay (seconds)
      description: Countdown before listening starts, so you can leave. Radar Engineering Mode is turned on at the start of the countdown. Use 0 from automations.
      required: false
      default: 15
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: s
    margin:
      name: Headroom (points)
      description: Added above the highest energy seen. Home Assistant only sees about one in ten of the radar's readings, so the headroom covers the ones it missed. Raise it if the radar still triggers with nobody there; lower it if it misses people. Headroom (points) and Headroom (percent) cannot both be 0.
      required: false
      default: 10
      selector:
        number:
          min: 0
          max: 50
    margin_pct:
      name: Headroom (percent)
      description: Relative headroom; the larger of the two headrooms is used per gate.
      required: false
      default: 25
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    kind:
      name: Thresholds to set
      required: false
      default: both
      selector:
        select:
          options:
            - both
            - move
            - still
    apply:
      name: Apply
      description: Turn off to preview. The new thresholds are computed and reported without changing any of them; Radar Engineering Mode is still turned on for the listen.
      required: false
      default: true
      selector:
        boolean: {}
    wait:
      name: Wait for the result
      description: Block until the calibration finishes and return the full result (use with response_variable).
      required: false
      default: false
      selector:
        boolean: {}

cancel_calibration:
  name: Cancel calibration
  description: Stops a running calibration. Nothing is written if it had not started writing; values already written stay until you restore.
  fields:
    device_id:
      name: Radar Device
      required: true
      selector:
        device:
          filter:
            - integration: esphome

restore_gate_thresholds:
  name: Restore gate thresholds
  description: Writes the thresholds saved before the last calibration (or a chosen snapshot) back to the radar. The current values are saved first, so a restore can itself be undone.
  fields:
    device_id:
      name: Radar Device
      required: true
      selector:
        device:
          filter:
            - integration: esphome
    snapshot_id:
      name: Snapshot
      description: Id of a saved snapshot; omit for the newest.
      required: false
      selector:
        text: {}
    wait:
      name: Wait for the result
      required: false
      default: false
      selector:
        boolean: {}
