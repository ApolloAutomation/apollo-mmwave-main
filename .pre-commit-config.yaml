# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# This configuration uses local hooks that rely on packages
# defined in requirements.txt, avoiding separate pre-commit environments.
# TODO(REVIEW_REPORT.md X05): language: system takes ruff from PATH, so commits fail (or run an unpinned ruff) without .venv active; consider astral-sh/ruff-pre-commit v0.16.10 or entry .venv/bin/ruff, or document committing with .venv active.
repos:
  - repo: local
    hooks:
      # Run the Ruff linter with auto-fix
      - id: ruff
        name: ruff
        entry: ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        require_serial: true

      # Run the Ruff formatter
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
        require_serial: true
