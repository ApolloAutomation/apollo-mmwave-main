name: Lint

on:
  push:
    branches:
      - "main"
  pull_request:

permissions: {}

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.9.3"

      # Only ruff is needed here; the pytest job exercises the Home Assistant pin.
      - name: Install ruff
        run: |
          uv venv
          uv pip install "$(grep -E '^ruff==' requirements.txt)"

      - name: Lint check
        run: scripts/lint-check
