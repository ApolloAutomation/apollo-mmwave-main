name: Test

on:
  push:
    branches:
      - "main"
  pull_request:

permissions: {}

jobs:
  pytest:
    name: "pytest"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.3"

      - name: Install test requirements
        run: |
          uv venv
          uv pip install -r requirements-test.txt

      # pytest-cov comes in with pytest-homeassistant-custom-component, so
      # this needs no extra requirement. The table is informational only: no
      # threshold is enforced.
      - name: Run pytest
        run: >-
          uv run --no-project pytest tests/ -q
          --cov=custom_components/apollo_mmwave
          --cov-report=term-missing

  frontend:
    name: "vitest + bundle sync"
    runs-on: "ubuntu-latest"
    defaults:
      run:
        working-directory: frontend-src
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pin the Node major the committed bundles were built with, so the
      # bundle-sync check below does not move when the runner image's default
      # Node changes.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run vitest
        run: npm test

      # The card, strategy and zone map suites again, against the committed
      # bundles instead of the sources (vitest.bundles.config.ts). The next
      # step proves those bundles match a fresh build.
      - name: Run the suites against the committed bundles
        run: npm run test:bundles

      # git diff only sees tracked files. vite runs with emptyOutDir off, so a
      # renamed bundle leaves the old file untouched and the new one untracked;
      # git status also reports untracked and deleted files.
      - name: Build and verify the committed bundles are current
        run: |
          npm run build
          git status --porcelain -- ../custom_components/apollo_mmwave/www
          test -z "$(git status --porcelain -- ../custom_components/apollo_mmwave/www)"
