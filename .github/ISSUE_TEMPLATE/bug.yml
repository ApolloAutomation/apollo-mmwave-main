---
name: "Bug report"
description: "Report a bug with the custom integration"
labels: ["bug"]
body:
- type: markdown
  attributes:
    value: Before you open a new issue, search through the existing issues to see if others have had the same problem.
- type: input
  attributes:
    label: "Home Assistant version"
    description: "The version of Home Assistant you are using"
    placeholder: "2026.8.1"
  validations:
    required: true
- type: input
  attributes:
    label: "Integration version"
    description: "The version of this custom integration you are using"
    placeholder: "2.3.0"
  validations:
    required: false
- type: textarea
  attributes:
    label: "System Health details"
    description: "Paste the data from the System Health card in Home Assistant (https://www.home-assistant.io/more-info/system-health#github-issues)"
  validations:
    required: false
- type: checkboxes
  attributes:
    label: Checklist
    options:
      - label: I have enabled debug logging for my installation.
        required: true
      - label: I have filled out the issue template to the best of my ability.
        required: true
      - label: This issue only contains 1 issue (if you have multiple issues, open one issue for each issue).
        required: true
      - label: This issue is not a duplicate issue of any [previous issues](https://github.com/ApolloAutomation/apollo-mmwave-main/issues?q=is%3Aissue+label%3A%22Bug%22+).
        required: true
- type: textarea
  attributes:
    label: "Describe the issue"
    description: "A clear and concise description of what the issue is."
  validations:
    required: true
- type: textarea
  attributes:
    label: Reproduction steps
    description: "Without steps to reproduce, it will be hard to fix. It is very important that you fill out this part. Issues without it will be closed."
    value: |
      1.
      2.
      3.
      ...
  validations:
    required: true
- type: textarea
  attributes:
    label: "Debug logs"
    description: "To enable debug logs check this https://www.home-assistant.io/integrations/logger/, this **needs** to include _everything_ from startup of Home Assistant to the point where you encounter the issue."
    render: text
  validations:
    required: true

- type: textarea
  attributes:
    label: "Apollo mmWave support file"
    description: "Open Settings > Devices & services > Apollo mmWave, choose Download diagnostics from the three dots menu, and drag the file here. It leaves out MAC and IP addresses and Wi-Fi names. (see https://www.home-assistant.io/integrations/diagnostics/ for info)"
  validations:
    required: false
